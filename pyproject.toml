[project]
name = "charm"
version = "0.1.0"
description = "Head model generation from MRI (CHARM, extracted from SimNIBS)"
license = "GPL-3.0-only"
license-files = ["LICENSE", "3RD-PARTY.md"]
authors = [
    { name = "Sriman Achanta", email = "68172138+srimanachanta@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    # brainnet, brainsynth and cortech aren't on PyPI (its brainnet is another project). Direct references keep a
    # wheel installable on its own, at the cost of PyPI refusing the upload.
    "brainnet @ git+https://github.com/simnibs/brainnet@v0.2",
    "brainsynth @ git+https://github.com/simnibs/brainsynth@v0.1",
    "cat-surf>=1.1.8",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp311-cp311-macosx_14_0_arm64.whl ; python_version == '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp311-cp311-manylinux_2_34_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp312-cp312-macosx_14_0_arm64.whl ; python_version == '3.12' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp312-cp312-manylinux_2_34_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp313-cp313-macosx_14_0_arm64.whl ; python_version == '3.13' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp313-cp313-manylinux_2_34_x86_64.whl ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp314-cp314-macosx_14_0_arm64.whl ; python_version == '3.14' and sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cortech @ https://github.com/srimanachanta/cortech/releases/download/v0.1.0/cortech-0.1-cp314-cp314-manylinux_2_34_x86_64.whl ; python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cyclopts>=5.3.3",
    "h5py>=3.10",
    "matplotlib>=3.10.9",
    "nibabel>=5.4.2",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "torch",
]

[project.scripts]
charm = "charm.cli.charm:main"

[build-system]
requires = [
    "scikit-build-core>=0.12.1,<0.13",
    "nanobind>=3.0,<4",
    "numpy>=2.0.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/charm"]
wheel.exclude = ["**.cpp", "**.cxx", "**.c", "**.h", "**/CMakeLists.txt"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.editable]
mode = "redirect"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "ty>=0.0.98"]

[tool.ruff]
line-length = 120
# Generated by nanobind at build time
extend-exclude = ["src/**/*.pyi"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/**/CMakeLists.txt" },
    { file = "cmake/*.cmake" },
    { file = "src/**/*.{h,c,cpp,cxx}" },
]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
build-frontend = "build[uv]"
build-verbosity = 1
test-groups = ["dev"]
test-sources = ["tests"]
test-command = "pytest tests"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install tbb boost gmp mpfr"
# delocate refuses to bundle Homebrew libraries built for a newer macOS than this, so it has to match the runner
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# glibc 2.34 is what the cortech wheels need
manylinux-x86_64-image = "manylinux_2_34"
before-all = "bash tools/ci/linux_deps.sh"
environment = { CHARM_DEPS_DIR = "/deps" }
# The default CUDA build of PyTorch is several gigabytes
test-environment = { UV_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu", UV_INDEX_STRATEGY = "unsafe-best-match" }
