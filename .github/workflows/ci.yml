name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: sudo apt-get update && sudo apt-get install -y libtbb-dev libboost-dev libgmp-dev libmpfr-dev ninja-build
      - uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-lint-${{ hashFiles('cmake/ITK.cmake') }}
      # The build also generates the stubs of the native modules that ty reads
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Homebrew bottles on the runner set the minimum macOS of the wheels, see MACOSX_DEPLOYMENT_TARGET
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7

      # ITK takes most of the build time. On Linux it's built inside the container, so the cache is mounted at the
      # CHARM_DEPS_DIR the container uses.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Linux' && format('{0}/deps', runner.temp) || 'build/deps' }}
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/ITK.cmake') }}

      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ runner.temp }}/deps:/deps"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, wheels, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
