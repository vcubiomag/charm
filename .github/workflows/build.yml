name: Build Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Homebrew bottles on the runner set the minimum macOS of the wheels, see MACOSX_DEPLOYMENT_TARGET
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The build[uv] frontend runs uv on the host for macOS builds. Linux builds use the uv in the manylinux image.
      - uses: astral-sh/setup-uv@v10.3.3

      # ITK takes most of the build time. On Linux it's built inside the container, so the cache is mounted at the
      # CHARM_DEPS_DIR the container uses. Release builds skip the cache so a poisoned entry can't reach a release.
      - uses: actions/cache@v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: ${{ runner.os == 'Linux' && format('{0}/deps', runner.temp) || 'build/deps' }}
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/ITK.cmake') }}

      # Builds and tests the wheels, see [tool.cibuildwheel] in pyproject.toml
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ runner.temp }}/deps:/deps"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
